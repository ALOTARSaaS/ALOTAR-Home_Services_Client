<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ALOTAR Home Services</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root{--bg:#090a0d;--panel:#111318;--panel2:#171a20;--text:#f7f4eb;--muted:#aaa69b;--gold:#d9b35f;--gold2:#f2d98d;--line:#2b2d33;--danger:#ff7b7b}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -10%,#2a2519 0,#111216 30%,var(--bg) 60%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,input,select{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(88px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.brand{font-weight:900;letter-spacing:.18em}.brand span{color:var(--gold2)}.lang{background:#16181d;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 12px}
    .hero{padding:26px 0 18px}.eyebrow{color:var(--gold2);font-size:12px;font-weight:800;letter-spacing:.15em}.hero h1{font-size:34px;line-height:1.02;margin:9px 0 10px}.hero p{color:var(--muted);line-height:1.55;margin:0}
    .card{background:linear-gradient(145deg,rgba(242,217,141,.10),rgba(255,255,255,.025) 28%,rgba(255,255,255,.015));border:1px solid rgba(217,179,95,.32);box-shadow:0 18px 50px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.06);border-radius:22px;padding:18px;margin:14px 0}
    label{display:block;color:var(--muted);font-size:13px;margin:12px 0 7px}.input{width:100%;background:#0d0f13;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:15px;outline:none}.input:focus{border-color:var(--gold)}
    .btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:850;margin-top:14px;cursor:pointer}.primary{background:linear-gradient(120deg,#a97b25,#f0d17a,#b88a31);color:#151006}.secondary{background:#1b1e24;color:var(--text);border:1px solid var(--line)}
    .status{font-size:13px;min-height:20px;margin-top:10px;color:var(--muted)}.status.err{color:var(--danger)}
    .hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.provider{padding:15px;border-radius:18px;background:var(--panel2);border:1px solid var(--line)}.provider h3{margin:8px 0 4px;font-size:16px}.meta{font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(217,179,95,.12);color:var(--gold2);font-size:11px;margin:6px 5px 0 0}
    .session{display:flex;justify-content:space-between;align-items:center;gap:10px}.session .btn{width:auto;margin:0;padding:10px 13px}.footer{color:#716e66;font-size:11px;text-align:center;margin-top:24px}
    @media(max-width:420px){.hero h1{font-size:30px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand">ALOTAR <span>HOME</span></div><button id="langBtn" class="lang">EN</button></header>

  <section id="loginView">
    <div class="hero"><div class="eyebrow" data-i18n="eyebrow">SERVICIOS A DOMICILIO</div><h1 data-i18n="title">Encuentra ayuda confiable, donde la necesites.</h1><p data-i18n="subtitle">Ingresa con tu correo y un código seguro. Sin contraseñas.</p></div>
    <div class="card">
      <div id="emailStep">
        <label data-i18n="email">Correo electrónico</label><input id="email" class="input" type="email" autocomplete="email" placeholder="tu@correo.com">
        <button id="requestBtn" class="btn primary" data-i18n="sendOtp">Enviar código</button>
      </div>
      <div id="otpStep" class="hidden">
        <label data-i18n="otp">Código de 6 dígitos</label><input id="otp" class="input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
        <button id="verifyBtn" class="btn primary" data-i18n="verify">Ingresar</button><button id="backBtn" class="btn secondary" data-i18n="changeEmail">Cambiar correo</button>
      </div>
      <div id="authStatus" class="status"></div>
    </div>
  </section>

  <section id="homeView" class="hidden">
    <div class="session"><div><div class="eyebrow">ALOTAR HOME</div><strong data-i18n="welcome">Hola, ¿qué necesitas hoy?</strong></div><button id="logoutBtn" class="btn secondary" data-i18n="logout">Salir</button></div>
    <div class="card">
      <label data-i18n="account">Empresa / cuenta</label><input id="accountId" class="input" placeholder="HSA_...">
      <label data-i18n="mode">Buscar por</label>
      <select id="mode" class="input"><option value="CANONICAL_TAXONOMY" data-i18n="category">Categoría</option><option value="EXACT_HOME_SERVICE_ID" data-i18n="exact">Servicio exacto</option></select>
      <label id="queryLabel" data-i18n="categoryKey">Clave de categoría</label><input id="queryValue" class="input" placeholder="LIMPIEZA">
      <button id="discoverBtn" class="btn primary" data-i18n="search">Buscar prestadores</button><div id="discoverStatus" class="status"></div>
    </div>
    <div id="results" class="grid"></div>
  </section>
  <div class="footer">ALOTAR · Home Services PWA V1</div>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbxhpU7b6Kaw04Ces-YuvILmOeQ3RsLSYkap8fBKoRJyVjFSZl4rfEOugcARguv9_M9_aQ/exec';
const K={token:'alotar.hs.session',account:'alotar.hs.account',lang:'alotar.hs.lang'};
let challengeId='', lang=localStorage.getItem(K.lang)||'es';
const $=id=>document.getElementById(id);
const T={es:{eyebrow:'SERVICIOS A DOMICILIO',title:'Encuentra ayuda confiable, donde la necesites.',subtitle:'Ingresa con tu correo y un código seguro. Sin contraseñas.',email:'Correo electrónico',sendOtp:'Enviar código',otp:'Código de 6 dígitos',verify:'Ingresar',changeEmail:'Cambiar correo',welcome:'Hola, ¿qué necesitas hoy?',logout:'Salir',account:'Empresa / cuenta',mode:'Buscar por',category:'Categoría',exact:'Servicio exacto',categoryKey:'Clave de categoría',serviceId:'ID del servicio',search:'Buscar prestadores',sending:'Enviando código…',sent:'Revisa tu correo.',authing:'Verificando…',bad:'No fue posible completar la solicitud.',searching:'Buscando…',none:'No encontramos prestadores para esta búsqueda.',sessionExpired:'Tu sesión terminó. Ingresa nuevamente.'},en:{eyebrow:'HOME SERVICES',title:'Trusted help, wherever you need it.',subtitle:'Sign in with your email and a secure code. No passwords.',email:'Email',sendOtp:'Send code',otp:'6-digit code',verify:'Sign in',changeEmail:'Change email',welcome:'Hi, what do you need today?',logout:'Sign out',account:'Company / account',mode:'Search by',category:'Category',exact:'Exact service',categoryKey:'Category key',serviceId:'Service ID',search:'Find providers',sending:'Sending code…',sent:'Check your email.',authing:'Verifying…',bad:'We could not complete the request.',searching:'Searching…',none:'No providers found for this search.',sessionExpired:'Your session ended. Please sign in again.'}};
function tr(k){return T[lang][k]||k} function paint(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=tr(x.dataset.i18n));$('langBtn').textContent=lang==='es'?'EN':'ES';syncMode()}
function status(id,msg,err=false){$(id).textContent=msg;$(id).className='status'+(err?' err':'')}
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error('NON_JSON_RESPONSE')}return j}
function showHome(){const on=!!localStorage.getItem(K.token);$('loginView').classList.toggle('hidden',on);$('homeView').classList.toggle('hidden',!on);$('accountId').value=localStorage.getItem(K.account)||''}
function clearLocal(){localStorage.removeItem(K.token);challengeId='';showHome()}
$('langBtn').onclick=()=>{lang=lang==='es'?'en':'es';localStorage.setItem(K.lang,lang);paint()}
$('requestBtn').onclick=async()=>{const email=$('email').value.trim();if(!email)return status('authStatus',tr('bad'),true);status('authStatus',tr('sending'));try{const r=await post({action:'requestAuthenticationOtp',payload:{email}});challengeId=String(r?.data?.challenge_id||'');if(!r.ok||!challengeId)throw 0;$('emailStep').classList.add('hidden');$('otpStep').classList.remove('hidden');status('authStatus',tr('sent'))}catch(e){status('authStatus',tr('bad'),true)}}
$('backBtn').onclick=()=>{challengeId='';$('otpStep').classList.add('hidden');$('emailStep').classList.remove('hidden');status('authStatus','')}
$('verifyBtn').onclick=async()=>{const otp=$('otp').value.trim();if(!challengeId||!/^\d{6}$/.test(otp))return status('authStatus',tr('bad'),true);status('authStatus',tr('authing'));try{const r=await post({action:'verifyAuthenticationOtp',payload:{challenge_id:challengeId,otp}});const token=String(r?.data?.session_token||'');if(!r.ok||r?.data?.authenticated!==true||!token)throw 0;localStorage.setItem(K.token,token);$('otp').value='';status('authStatus','');showHome()}catch(e){status('authStatus',tr('bad'),true)}}
function syncMode(){const exact=$('mode').value==='EXACT_HOME_SERVICE_ID';$('queryLabel').textContent=tr(exact?'serviceId':'categoryKey');$('queryValue').placeholder=exact?'HSSVC_...':'LIMPIEZA'}
$('mode').onchange=syncMode;
$('discoverBtn').onclick=async()=>{const token=localStorage.getItem(K.token)||'',account=$('accountId').value.trim(),v=$('queryValue').value.trim(),mode=$('mode').value;if(!token){clearLocal();return}if(!account||!v)return status('discoverStatus',tr('bad'),true);localStorage.setItem(K.account,account);status('discoverStatus',tr('searching'));$('results').innerHTML='';const payload=mode==='EXACT_HOME_SERVICE_ID'?{mode,home_service_id:v}:{mode,canonical_key:v};try{const r=await post({action:'providerDiscovery',session_token:token,home_account_id:account,payload});if(!r.ok){if(/SESSION|AUTHENTICATION/.test(String(r.error||''))){clearLocal();return status('authStatus',tr('sessionExpired'),true)}throw 0}const dto=r?.data?.data||r?.data||{};const providers=Array.isArray(dto.providers)?dto.providers:[];status('discoverStatus',providers.length?'':tr('none'));$('results').innerHTML=providers.map(p=>`<article class="provider"><div class="eyebrow">${esc(p.rating||'—')} ★</div><h3>${esc(p.public_name||'Prestador')}</h3><div class="meta">${esc(p.completed_services||0)} servicios · ${esc(p.rating_count||0)} valoraciones</div>${(p.verification_badges||[]).map(b=>`<span class="badge">${esc(b)}</span>`).join('')}</article>`).join('')}catch(e){status('discoverStatus',tr('bad'),true)}}
$('logoutBtn').onclick=async()=>{const token=localStorage.getItem(K.token)||'';clearLocal();try{if(token)await post({action:'logout',session_token:token,payload:{}})}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
paint();showHome();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
